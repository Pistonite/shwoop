<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>shwoop test 10</title>
  <style>
    body { font-family: monospace; padding: 2rem; background: #111; color: #eee; }
    h1 { margin-bottom: 1rem; }
    #status { margin-bottom: 1rem; }
    .dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      background: gray;
    }
    .dot.connected { background: #4c4; }
    .dot.disconnected { background: #c44; }
    #log {
      border: 1px solid #333;
      padding: 1rem;
      height: 300px;
      overflow-y: auto;
      background: #1a1a1a;
    }
    .log-entry { margin: 2px 0; }
    .log-entry.reload { color: #4cf; }
    .log-entry.info  { color: #aaa; }
    .log-entry.error { color: #f66; }
    button {
      margin-top: 1rem;
      padding: 0.4rem 1rem;
      font-family: monospace;
      background: #222;
      color: #eee;
      border: 1px solid #555;
      cursor: pointer;
    }
    button:hover { background: #333; }
  </style>
</head>
<body>
  <h1>shwoop test</h1>
  <div id="status"><span class="dot" id="dot"></span><span id="status-text">changed2</span></div>
  <div id="log"></div>
  <button id="btn-reload">POST /reload</button>
</body>
</html>
