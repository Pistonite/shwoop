<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PLACEHOLDER_LINK_ICON -->
    <title>Loading...</title>
    <style>
        :root { color-scheme: light dark; }
        body { padding: 0; margin: 0; }
        iframe.content-frame {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            border: none; width: 100vw; height: 100vh;
        }
        div.status-bar {
            position: fixed; bottom: 20px; left: 0; height: 28px;
            z-index: 9999;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 12px;
            box-sizing: border-box;
            padding: 4px 12px 4px 4px;
            border: 1px solid #888;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
            background: #222;
            color: #eee;
            white-space: nowrap;
            overflow: hidden;
            transition: width 0.2s ease, color 0.2s ease;
        }
        div.status-bar.green  { color: #8f8; }
        div.status-bar.yellow { color: #ff8; }
        div.status-bar.red    { color: #f88; }
        div.status-bar.cyan   { color: #8ff; }
        div.status-bar.orange { color: #fa8; }
        div.status-bar button {
            all: unset;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px; height: 20px;
            border-radius: 3px;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            transition: background 0.15s ease;
            vertical-align: middle;
        }
        div.status-bar button:hover  { background: #3a3a3a; }
        div.status-bar button:active { background: #4a4a4a; }
    </style>
    <!-- PLACEHOLDER_SERVER_STYLE -->
  </head>
  <body>
    <div class="status-bar" style="display:hidden"><button class="status-bar-button"></button><button class="status-bar-scroll-restore-button"></button><span class="status-bar-label"></span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
