[package]
name = "shwoop"
description = "Tool to serve static webpage with optional build-and-hot-reload feature"
repository = "https://github.com/Pistonite/shwoop"
authors = ["Pistonight <pistonknight@outlook.com>"]
version = "0.2.0"
edition = "2024"
license = "MIT"
exclude = [
    ".github/**/*",
    "Taskfile.yml",
]


[dependencies.cu]
package = "pistonite-cu"
version = "0.8.0"
features = [ "cli", "derive", "coroutine", "process" ]

[dependencies]
actix = "0.13.5"
actix-files = "0.6.10"
actix-web = "4.13.0"
actix-ws = "0.4.0"
dashmap = "6.1.0"
log = "0.4.29"
lol_html = "2.7.2"
tokio = "1"
oneshot = { version = "0.2.1", features = [ "async" ] }
watchexec = "8.2.0"
watchexec-events = "6.1.0"
watchexec-signals = "5.0.1"
