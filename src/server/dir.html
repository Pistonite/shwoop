<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Index </title>
  <script>document.title="Index of "+location.pathname</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      display: flex;
      justify-content: center;
      background: #111;
      color: #ccc;
    }
    @media (prefers-color-scheme: light) {
      body { background: #f8f8f8; color: #333; }
    }
    .container { padding: 48px 32px; width: 100%; max-width: 900px; }
    .heading { margin-bottom: 20px; display: flex; align-items: baseline; gap: 8px; }
    h1.label { font-size: 14px; font-weight: normal; color: #666; }
    @media (prefers-color-scheme: light) { h1.label { color: #999; } }
    h2.shwoop--path-label { font-size: 17px; font-weight: 600; color: #fff; }
    @media (prefers-color-scheme: light) { h2.shwoop--path-label { color: #111; } }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td { padding: 4px 10px; border-bottom: 1px solid #1c1c1c; }
    @media (prefers-color-scheme: light) { td { border-bottom-color: #e8e8e8; } }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1a1a1a; }
    @media (prefers-color-scheme: light) { tr:hover td { background: #efefef; } }
    a { text-decoration: none; }
    a:hover { text-decoration: underline; }
    .d { color: #f0b429; }
    .f { color: #7eb8f7; }
    .up { color: #666; }
    @media (prefers-color-scheme: light) {
      .d { color: #a06800; }
      .f { color: #1a5fa8; }
      .up { color: #bbb; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="heading">
      <h1 class="label">Index of</h1>
      <h2 class="shwoop--path-label"></h2>
    </div>
    <table>
      <tbody>
        PLACEHOLDER_ROWS
      </tbody>
    </table>
  </div>
  <script>document.querySelector("h2.shwoop--path-label").innerText=location.pathname</script>
</body>
</html>
