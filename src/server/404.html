<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>404 Not Found</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { color-scheme: light dark; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      background: #111;
      color: #ccc;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 480px;
      width: 100%;
      padding: 32px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #1a1a1a;
    }
    .status {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .code {
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
      color: #f88;
      letter-spacing: -1px;
    }
    .text {
      font-size: 14px;
      color: #eee;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .divider {
      height: 1px;
      background: #333;
    }
    .url {
      font-size: 12px;
      color: #666;
      word-break: break-all;
    }
    .hint {
      font-size: 11px;
      color: #4a4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status">
      <div class="code">404 Not Found</div>
    </div>
    <div class="divider"></div>
    <div class="shwoop-error-url"></div>
    <div class="hint">this page will automatically reload when the resource becomes available</div>
    <script>
        document.querySelector("div.shwoop-error-url").innerText=location.pathname
    </script>
  </div>
</body>
</html>
